name: Build & publish harbory-agent .deb

# Fires on a version tag (v1.2.3) — builds amd64 + arm64 .debs, signs and
# publishes them into the reprepro-managed apt repo, then syncs the repo's
# dists/+pool/ output to the server that serves
# harbory-apt.preetindersingh.tech/apt/. See deploy/apt-repo.md for the full
# setup this workflow assumes already exists (GPG key + secrets, target
# server directory).
on:
  push:
    tags:
      - "v*.*.*"
  # Manual trigger, so CI changes can be exercised from a branch without
  # burning/recreating a release tag each iteration. Note a tag push builds
  # the *tagged* commit — pushing a fix to master does not re-run anything
  # until the tag is moved.
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
            cross_packages: ""
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            # Native gcc cross-toolchain, not the `cross` tool — its
            # Docker-based path proved unreliable on this runner (silently
            # fell back to building on the host, defeating the point).
            # See .cargo/config.toml for the matching linker/strip config.
            cross_packages: "gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Install cross-toolchain (arm64 only)
        if: matrix.cross_packages != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.cross_packages }}

      - name: Build release binary
        run: cargo build --release -p harbory-agent --target ${{ matrix.target }}

      - name: Build .deb
        run: cargo deb -p harbory-agent --target ${{ matrix.target }} --no-build

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: harbory-agent-${{ matrix.arch }}
          path: target/${{ matrix.target }}/debian/*.deb

  publish:
    needs: build
    runs-on: ubuntu-latest
    # The signing/deploy secrets are *environment* secrets, not repository
    # secrets — without this line they silently resolve to empty strings
    # rather than failing loudly (gpg then reports "no valid OpenPGP data
    # found", which looks like a corrupt key rather than a missing one).
    environment: harbory
    steps:
      - uses: actions/checkout@v4

      - name: Download all .deb artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Install reprepro
        run: sudo apt-get update && sudo apt-get install -y reprepro

      - name: Import signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          # Fail loudly on a missing secret. An unset secret expands to an
          # empty string, which gpg reports as "no valid OpenPGP data
          # found" — indistinguishable from a genuinely corrupt key.
          if [ -z "$APT_GPG_PRIVATE_KEY" ]; then
            echo "::error::APT_GPG_PRIVATE_KEY is empty. It is an environment secret — check this job declares 'environment: harbory'." >&2
            exit 1
          fi
          mkdir -m 700 -p "$HOME/.gnupg"
          echo "$APT_GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import
          # See deploy/apt-repo.md for why this key is deliberately
          # passphrase-less (dedicated apt-signing key, not a personal one).

      - name: Include .debs into the repo
        run: |
          for deb in artifacts/*/*.deb; do
            reprepro -b apt-repo includedeb stable "$deb"
          done

      - name: Export public key for distribution
        run: |
          # --batch --yes: the file is committed to the repo, so it already
          # exists on checkout and gpg would otherwise prompt to overwrite
          # it — which fails on a runner with no TTY. Export the signing key
          # by fingerprint rather than everything in the keyring.
          gpg --batch --yes --armor \
            --export 257E0ADD08DE9DDE170CAE25E893FE8771735CF8 \
            --output apt-repo/harbory-archive-keyring.asc
          gpg --show-keys apt-repo/harbory-archive-keyring.asc

      - name: Sync repo to server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.APT_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.APT_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.APT_DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.APT_DEPLOY_PATH }} # e.g. /var/www/harbory/apt
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::APT_DEPLOY_SSH_KEY is empty — check this job declares 'environment: harbory'." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          # The secret holds the key base64-encoded, same as the GPG one.
          # A raw PEM pasted through the web UI picks up CRLF line endings
          # (it is generated on Windows) or loses its trailing newline,
          # either of which makes OpenSSH reject it with the singularly
          # unhelpful "error in libcrypto". base64 survives the round trip.
          echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null \
            || { echo "::error::deploy key is not a valid private key after decoding" >&2; exit 1; }
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          # -rltpvz rather than -a: -a implies -D (devices/specials) and
          # -go (owner/group), all meaningless for a static file repo and
          # unusable as a non-root user anyway. Avoiding -D also keeps the
          # remote side from having to negotiate it away.
          rsync -rltpvz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            apt-repo/dists apt-repo/pool apt-repo/harbory-archive-keyring.asc \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
