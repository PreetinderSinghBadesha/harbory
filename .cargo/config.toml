# cargo-deb strips the release binary before packaging. When cross-compiling
# aarch64 on an x86_64 runner (see .github/workflows/release-deb.yml), the
# host's own `strip` can't read a foreign-architecture ELF — point it at the
# aarch64 toolchain's own strip instead (installed via
# binutils-aarch64-linux-gnu in that workflow).
[target.aarch64-unknown-linux-gnu]
strip = "aarch64-linux-gnu-strip"
