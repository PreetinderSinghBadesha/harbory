# Cross-compiling aarch64 on the x86_64 GitHub Actions runner (see
# .github/workflows/release-deb.yml) — native gcc cross-toolchain, not the
# `cross` tool (its Docker-based path was unreliable in practice, silently
# falling back to building on the host and defeating the point). The linker
# and strip binaries here come from gcc-aarch64-linux-gnu and
# binutils-aarch64-linux-gnu, installed in that workflow before the build.
[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
strip = { path = "aarch64-linux-gnu-strip" }
