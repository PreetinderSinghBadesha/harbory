syntax = "proto3";

package harbory.v1;

// PairingService is used exactly once per agent: to bootstrap trust between
// a brand-new agent and the control plane using a short-lived pairing token.
// Every subsequent interaction uses the long-lived credential issued here.
service PairingService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
}

message RegisterRequest {
  // Single-use pairing token displayed/copied from the dashboard.
  string pairing_token = 1;
  // Agent's Ed25519 public key, generated locally before this call is made.
  bytes public_key = 2;
}

message RegisterResponse {
  // Server-assigned identity for this agent, stable for its lifetime.
  string agent_id = 1;
  string account_id = 2;
  // Ed25519-signed credential binding agent_id <-> account_id <->
  // public_key_fingerprint. Opaque to the agent; presented on every future
  // connection. See /docs/security.md for the exact payload layout.
  bytes credential = 3;
  // Control plane's Ed25519 public key, so the agent can locally sanity
  // check the credential signature without a round trip.
  bytes control_plane_public_key = 4;
}

// AgentStreamService carries the single persistent, authenticated channel
// between an already-paired agent and the control plane: connect-time
// handshake, heartbeats now, and (in later phases) command dispatch and
// state reporting over this same stream rather than separate RPCs.
service AgentStreamService {
  // Named Stream rather than Connect: tonic's generated client already has
  // an associated `connect(dst)` constructor and the names collide.
  rpc Stream(stream AgentMessage) returns (stream ControlPlaneMessage);
}

// Handshake, in order: Hello -> (server) Challenge -> ChallengeResponse ->
// (server) Welcome -> Heartbeat*. See /docs/connection-lifecycle.md.
// ContainerStateReport and ContainerCommand (Phase 3) flow over this same
// stream once authenticated, rather than as separate RPCs.
message AgentMessage {
  oneof payload {
    Hello hello = 1;
    ChallengeResponse challenge_response = 2;
    Heartbeat heartbeat = 3;
    ContainerStateReport state_report = 4;
    ProxyState proxy_state = 5;
    LogsResponse logs_response = 6;
    ComposeStateReport compose_state_report = 7;
    ImagesResponse images_response = 8;
    NetworksResponse networks_response = 9;
    SystemInfoResponse system_info_response = 10;
  }
}

message ControlPlaneMessage {
  oneof payload {
    Challenge challenge = 1;
    Welcome welcome = 2;
    HeartbeatAck heartbeat_ack = 3;
    ContainerCommand command = 4;
    ProxyConfig proxy_config = 5;
    LogsRequest logs_request = 6;
    ComposeCommand compose_command = 7;
    ImagesRequest images_request = 8;
    NetworksRequest networks_request = 9;
    SystemInfoRequest system_info_request = 10;
  }
}

message Hello {
  // The long-lived credential from RegisterResponse. Presenting it proves
  // the control plane issued it; it does not by itself prove the caller
  // holds the matching private key — that's what Challenge/ChallengeResponse
  // is for.
  bytes credential = 1;
}

message Challenge {
  // Random bytes, unique per connection attempt. The agent must sign these
  // exact bytes with its identity private key to prove possession.
  bytes nonce = 1;
}

message ChallengeResponse {
  // Ed25519 signature over the Challenge.nonce bytes.
  bytes signature = 1;
}

message Welcome {
  string agent_id = 1;
  uint32 heartbeat_interval_seconds = 2;
  uint32 missed_heartbeat_threshold = 3;
}

message Heartbeat {
  // Informational only (clock skew possible) — the control plane's own
  // receive time is the source of truth for online/offline computation.
  int64 timestamp = 1;
}

message HeartbeatAck {}

// --- Phase 3: container commands & state ---------------------------------
//
// v1 scope is deliberately narrow (see HARBORY_README.md §1): a desired
// container is either running (with a given image/env/ports/command) or
// absent. No restart policies, no scaling, no arbitrary scheduling — those
// are explicitly out of scope. See /docs/reconciliation.md.

message PortMapping {
  uint32 host_port = 1;
  uint32 container_port = 2;
}

// Builds the image from a git repo instead of pulling a pre-built one —
// see GitSource on ContainerSpec below for how it interacts with `image`.
message GitSource {
  // Plain https URL — the control plane embeds a clone credential into
  // this only in the message it actually sends over the wire, never in
  // what it persists to its own database.
  string repo_url = 1;
  // Branch, tag, or commit sha. Empty = the repo's default branch.
  string git_ref = 2;
  // Path to the Dockerfile, relative to the repo root. Empty =
  // "Dockerfile" at the root.
  string dockerfile_path = 3;
}

message ContainerSpec {
  // Logical name, unique per agent. The agent derives the actual Docker
  // container name from this (prefixed, labeled) — see
  // crates/agent/src/container.rs.
  string name = 1;
  // A real pullable image reference, OR — if git_source is set — a
  // synthetic "git+<repo_url>#<git_ref>" identity string used only for
  // reconciliation comparison and never passed to Docker directly. The
  // agent echoes this exact string back as the image on its
  // ContainerState report (via a `harbory.image` label, not Docker's own
  // reported image) specifically so the two stay comparable regardless
  // of which case this is — see docs/reconciliation.md.
  string image = 2;
  repeated string env = 3;      // "KEY=VALUE" entries
  repeated PortMapping ports = 4;
  // Empty = use the image's own ENTRYPOINT/CMD.
  repeated string command = 5;
  // If set, the agent builds this locally (via the Docker daemon's own
  // git-remote build-context support) instead of pulling `image` from a
  // registry.
  optional GitSource git_source = 6;
}

message ContainerCommand {
  oneof action {
    ContainerSpec deploy = 1;  // create-or-replace, idempotent
    string stop = 2;           // container name
    string remove = 3;         // container name
  }
}

enum ContainerStatus {
  CONTAINER_STATUS_UNSPECIFIED = 0;
  CONTAINER_STATUS_RUNNING = 1;
  CONTAINER_STATUS_STOPPED = 2;
  CONTAINER_STATUS_REMOVED = 3;
  CONTAINER_STATUS_ERROR = 4;
}

message ContainerState {
  string name = 1;
  string image = 2;
  ContainerStatus status = 3;
  // Populated when status == CONTAINER_STATUS_ERROR.
  string error = 4;
}

// Full snapshot of every Harbory-managed container on the agent's host,
// not a delta — simplest thing that can't drift, at the cost of a bit more
// bandwidth. Sent after Welcome, after executing any command, and on the
// same cadence as heartbeats.
message ContainerStateReport {
  repeated ContainerState containers = 1;
}

// --- Compose Stacks --------------------------------------------------------

message ComposeSpec {
  string name = 1;
  GitSource git_source = 2; // Always deployed from a repo
  string compose_file_path = 3; // Path to compose file (default: docker-compose.yml)
  repeated string env = 4;
}

message ComposeCommand {
  oneof action {
    ComposeSpec deploy = 1;
    string remove = 2; // name of the stack
  }
}

message ComposeState {
  string name = 1;
  ContainerStatus status = 2;
  string error = 3;
}

message ComposeStateReport {
  repeated ComposeState stacks = 1;
}

// --- Phase 4: reverse proxy management ------------------------------------
//
// One route = one Nginx `server{}` block (name-based virtual hosting).
// v1 does not merge multiple routes sharing a server_name+listen_port into
// one block with several `location`s — keep server_name distinct per
// route. See /docs/proxy-management.md.

message ProxyRoute {
  // Logical name, unique per agent. Presence in the desired set *is* "this
  // route should exist" — unlike containers there's no separate
  // running/absent status, because the whole config file is regenerated
  // from the full route set on every apply (see ProxyConfig).
  string name = 1;
  // Host header to match. Empty = catch-all (`server_name _;`).
  string server_name = 2;
  uint32 listen_port = 3;
  // Default "/" if empty.
  string path_prefix = 4;
  string upstream_host = 5;
  uint32 upstream_port = 6;
}

// Always the full desired set, not a delta — same rationale as
// ContainerStateReport: regenerating the whole config file from a
// complete snapshot can't drift out of sync the way an incremental patch
// sequence could.
message ProxyConfig {
  repeated ProxyRoute routes = 1;
}

message ProxyState {
  // SHA-256 of the routes this agent last successfully applied (see
  // crates/protocol/src/proxy_hash.rs) — compared against the control
  // plane's own hash of current desired state to decide whether to send a
  // fresh ProxyConfig. Empty if nothing has been applied yet.
  bytes applied_hash = 1;
  // Populated when the last apply attempt failed validation or reload.
  string error = 2;
}

// --- Phase 6+: container log snapshot ------------------------------------
//
// A fire-and-forget request/response pair over the existing persistent stream.
// The control plane sends LogsRequest with a unique request_id; the agent
// replies with LogsResponse carrying that same id so the control plane can
// match it back to the waiting HTTP request (via a oneshot channel).

message LogsRequest {
  // UUID generated by the control plane per HTTP request — used to match
  // this LogsResponse back to the waiting HTTP handler.
  string request_id = 1;
  // Logical container name (as used by Harbory, not the Docker-prefixed name).
  string container_name = 2;
  // How many lines from the tail to return. 0 = use agent default (100).
  uint32 tail_lines = 3;
}

message LogsResponse {
  // Echoes the request_id from the matching LogsRequest.
  string request_id = 1;
  // stdout+stderr combined, plain text. Empty when error is set.
  string logs = 2;
  // Populated if the container doesn't exist, hasn't started, or Docker
  // failed to retrieve logs for any reason.
  string error = 3;
}

// --- Images: list & remove -------------------------------------------------
//
// Same fire-and-forget request/response pattern as LogsRequest/LogsResponse:
// the control plane sends ImagesRequest with a unique request_id over the
// agent's live stream; the agent replies with ImagesResponse carrying that
// id, matched back to the waiting HTTP handler via a oneshot channel.
//
// One message covers both "list" and "remove-then-list": remove_image_id
// empty means list-only; set means "delete that image first, then return
// the fresh list" so the UI updates in a single round trip.

message ImagesRequest {
  string request_id = 1;
  // Docker image ID (the sha256:... digest or its hex) to delete before
  // re-listing. Empty = plain list. Refusing to multiplex more than one
  // removal per request keeps the failure story simple.
  string remove_image_id = 2;
}

message ImageInfo {
  // Docker's image ID (sha256 hex) — the stable handle for removal.
  string id = 1;
  // All tags (and dangling digests) pointing at this image; possibly empty
  // for dangling images.
  repeated string repo_tags = 2;
  int64 size_bytes = 3;
  // Image creation time, unix seconds.
  int64 created_at = 4;
  // True when at least one container on this host (running or stopped)
  // is based on this image — such images can't be removed without
  // removing the container first, so the UI can disable the button.
  bool in_use = 5;
}

message ImagesResponse {
  string request_id = 1;
  repeated ImageInfo images = 2;
  // Populated when the list or a requested removal failed; images may
  // still carry a partial/previous listing when a removal failed.
  string error = 3;
}

// --- Networks: list & remove -----------------------------------------------
//
// Same fire-and-forget request/response pattern as ImagesRequest/Response.

message NetworksRequest {
  string request_id = 1;
  // Docker network ID to remove before re-listing. Empty = plain list.
  string remove_network_id = 2;
}

message NetworkInfo {
  string id = 1;
  string name = 2;
  string driver = 3;
  string scope = 4;
  // False for Docker's own built-in networks (bridge/host/none) — the UI
  // disables removal for these rather than relying on the delete call to
  // fail, since Docker refuses to remove them anyway.
  bool removable = 5;
}

message NetworksResponse {
  string request_id = 1;
  repeated NetworkInfo networks = 2;
  string error = 3;
}

// --- System info: host resource snapshot -----------------------------------
//
// Same fire-and-forget request/response pattern as ImagesRequest/Response.
// Best-effort: any field the host doesn't expose is left at its zero value
// rather than failing the whole request.

message SystemInfoRequest {
  string request_id = 1;
}

message SystemInfoResponse {
  string request_id = 1;
  string hostname = 2;
  string os = 3;
  string kernel_version = 4;
  string docker_version = 5;
  uint32 cpu_count = 6;
  string cpu_model = 7;
  uint64 mem_total_bytes = 8;
  uint64 disk_total_bytes = 9;
  uint64 disk_used_bytes = 10;
  uint64 disk_free_bytes = 11;
  string primary_ip = 12;
  uint64 uptime_seconds = 13;
  // Populated only on total failure (e.g. can't reach Docker at all).
  // Individual missing fields above just stay zero/empty.
  string error = 14;
}
