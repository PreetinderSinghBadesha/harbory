[package]
name = "harbory-control-plane"
edition.workspace = true
version.workspace = true

[dependencies]
harbory-protocol = { path = "../protocol" }
harbory-common = { path = "../common" }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
axum = "0.7"
uuid = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
# Just for displaying proxy_state.applied_hash as a hex string in the
# GET /agents/{id}/proxy-routes response.
hex = "0.4"
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
# Postgres access with runtime-checked queries for now (compile-time query!
# macros need either a live DB at build time or a committed `.sqlx` offline
# cache — deferred until CI is set up; see docs/database.md).
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "migrate",
    "json",
    "macros",
] }

[dev-dependencies]
tokio = { workspace = true }
