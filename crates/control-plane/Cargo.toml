[package]
name = "harbory-control-plane"
edition.workspace = true
version.workspace = true

[dependencies]
harbory-protocol = { path = "../protocol" }
harbory-common = { path = "../common" }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
axum = "0.7"
# CORS for the React frontend (a separate origin in dev, e.g. the Vite
# dev server) calling this JSON API.
tower-http = { version = "0.5", features = ["cors"] }
uuid = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
# Just for displaying proxy_state.applied_hash as a hex string in the
# GET /agents/{id}/proxy-routes response.
hex = "0.4"
# Verifies Supabase-issued JWTs (both the legacy shared-secret HS256 form
# and the newer asymmetric ES256 form) on incoming HTTP requests — the
# standard, widely-used Rust JWT crate.
jsonwebtoken = "9"
# Fetches Supabase's JWKS once at startup (see jwks.rs) — rustls to match
# sqlx's TLS stack rather than pulling in a second TLS implementation.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Process-global counters/gauges for agent/control-plane health, exposed
# at GET /metrics in Prometheus text format — the standard combo for
# instrumenting Rust services.
metrics = "0.23"
metrics-exporter-prometheus = { version = "0.15", default-features = false }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
# Postgres access with runtime-checked queries for now (compile-time query!
# macros need either a live DB at build time or a committed `.sqlx` offline
# cache — deferred until CI is set up; see docs/database.md).
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "migrate",
    "json",
    "macros",
] }

[dev-dependencies]
tokio = { workspace = true }
tower = { version = "0.4", features = ["util"] }
